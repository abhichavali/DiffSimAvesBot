[project]
name = "DiffSimAvesBot"
version = "0.1.0"
description = "Tensegrity flapping-wing robot: .tg designs, MuJoCo CPU + MJX simulation, co-design"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.10.2",
    "matplotlib>=3.11.0",
    "mujoco>=3.4.0",
    "mujoco-mjx>=3.10.0",
    "numpy>=2.4.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "opt"]
